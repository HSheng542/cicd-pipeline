[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-demo-app"
version = "0.1.0"
description = "Small Python service used to demonstrate a DevSecOps CI pipeline"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
